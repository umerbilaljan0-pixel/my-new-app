[package]
name = "cleanplate"
version = "1.0.0"
description = "CLEANPLATE desktop — self-hostable media restoration suite"
authors = ["CLEANPLATE"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cleanplate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
